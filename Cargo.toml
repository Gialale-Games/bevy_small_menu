[package]
name = "bevy_small_menu"
version = "0.2.0"
edition = "2024"
authors = [
    "glklimmer <https://github.com/glklimmer>",
    "Gianluca Frongia <gianluca.frongia@protonmail.com>",
]
description = "A type-safe, headless menu plugin for Bevy Engine, enabling interactive menus from UI Nodes or Sprites."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Gialale-Games/bevy_small_menu"
categories = ["game-development", "games"]
keywords = ["bevy", "gamedev", "menu", "selection"]
exclude = ["assets/*"]

[dependencies]
bevy = { version = "0.20", default-features = false, features=  ["std", "2d"]}

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "ui"]}

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4
